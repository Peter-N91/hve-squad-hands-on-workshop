name: Publish workshop guide
# Manual, daily, or on a repository_dispatch from hve-squad when it publishes a release.
# Every build asks GitHub for the latest stable HVE Squad release (scripts/hve-squad-release.mjs),
# so the published guide always names, installs and links that release.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'
  repository_dispatch:
    types: [hve-squad-release]
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run release
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment